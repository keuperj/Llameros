[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llameros"
version = "0.1.0"
description = "A user-space, hardware-aware Ollama dashboard for Linux"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "psutil>=6,<8",
  "cryptography>=43",
  "python-pam>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
llameros = "llameros.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llameros"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]